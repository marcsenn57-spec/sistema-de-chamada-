<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>USF HUMBERTO VIERA - Controle de Chamada</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; background: #2c3e50; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        /* Estilo do Painel de Status */
        #status-dia {
            background: #1a252f;
            width: 350px;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 5px solid #2ecc71;
            font-size: 0.9rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .status-linha { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .destaque-status { color: #2ecc71; font-weight: bold; font-size: 1.1rem; }

        .box { background:  #1a252f; padding: 25px; border-radius: 10px; display: flex; flex-direction: column; gap: 15px; width: 350px; }
        label { font-weight: bold; font-size: 0.9rem; color: #bdc3c7; }
        input { padding: 12px; font-size: 1.1rem; border-radius: 5px; border: none; outline: none; }
        
        button { padding: 15px; font-size: 1.1rem; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; transition: 0.2s; }
        .btn-chamar { background: #27ae60; color: white; }
        .btn-chamar:hover { background: #2ecc71; }
        .btn-repetir { background: #f39c12; color: white; }
        
        .area-perigo { margin-top: 15px; border-top: 1px solid #455a64; padding-top: 15px; display: flex; flex-direction: column; gap: 10px; }
        .btn-reset { color:#bdc3c7; font-size:0.7rem; cursor:pointer; border:1.5px solid #000000; background: transparent; padding: 8px; }
        .btn-limpar-hist { color: #bdc3c7; font-size:0.7rem; cursor: pointer; border: 1.5px solid #000000; background: transparent; padding: 8px; }
    </style>
</head>
<body>

    <h1>CONTROLE DE CHAMADA</h1>

    <div id="status-dia">
        <div class="status-linha">
            <span>Data:</span>
            <span id="stat-data">--/--/----</span>
        </div>
        <div class="status-linha">
            <span>Status:</span>
            <span style="color: #2ecc71;">● Sistema Ativo</span>
        </div>
        <div class="status-linha" style="margin-top: 10px; border-top: 1px solid #2c3e50; padding-top: 10px;">
            <span>Total Atendimentos:</span>
            <span id="stat-total" class="destaque-status">0</span>
        </div>
    </div>

    <div class="box">
        <label>Número da Sala:</label>
        <input type="number" id="sala" value="1">
        
        <label>Nome do Paciente:</label>
        <input type="text" id="nome" placeholder="Digite o nome..." autocomplete="off">
        
        <button class="btn-chamar" onclick="enviar(true)">CHAMAR PRÓXIMO</button>
        <button class="btn-repetir" onclick="enviar(false)">REPETIR ATUAL</button>

        <div class="area-perigo">
            <button class="btn-reset" onclick="resetarTudo()">Zerar Tudo (NOVO DIA)</button>
            <button class="btn-limpar-hist" onclick="limparHistoricoPainel()">Zerar Últimas Chamadas (TV)</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { 
          apiKey: "AIzaSyAni301REp5IfvRTxxHLxCFWkdPr8Qrt68",
  authDomain: "painel-de-senhas-23.firebaseapp.com",
  databaseURL: "https://painel-de-senhas-23-default-rtdb.firebaseio.com",
  projectId: "painel-de-senhas-23",
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- FUNÇÃO PARA ATUALIZAR O STATUS NA TELA ---
        function atualizarStatus() {
            // Atualiza Data
            const hoje = new Date().toLocaleDateString('pt-BR');
            document.getElementById('stat-data').innerText = hoje;

            // Soma todas as senhas de todas as salas salvas no LocalStorage
            let total = 0;
            for (let i = 0; i < localStorage.length; i++) {
                let chave = localStorage.key(i);
                if (chave.startsWith('cont_sala_')) {
                    total += parseInt(localStorage.getItem(chave)) || 0;
                }
            }
            document.getElementById('stat-total').innerText = total;
        }

        function enviar(novo) {
            const salaInput = document.getElementById('sala').value;
            const nomeInput = document.getElementById('nome');
            let nomeParaChamar = nomeInput.value.toUpperCase();
            
            let chaveSala = 'cont_sala_' + salaInput;
            let contadorDaSala = parseInt(localStorage.getItem(chaveSala)) || 0;

            if (novo) {
                if (!nomeParaChamar) return alert("Digite o nome do paciente");
                contadorDaSala++;
                localStorage.setItem(chaveSala, contadorDaSala);
                
                nomeInput.dataset.ultimoNome = nomeParaChamar;
                nomeInput.dataset.ultimaSenha = contadorDaSala;
                nomeInput.dataset.ultimaSala = salaInput;
                nomeInput.value = ""; 
            } else {
                nomeParaChamar = nomeInput.dataset.ultimoNome;
                contadorDaSala = nomeInput.dataset.ultimaSenha;
                if (!nomeParaChamar) return alert("Não há chamada para repetir!");
            }

            db.ref('chamada').set({
                nome: nomeParaChamar,
                sala: salaInput,
                senha: `${String(contadorDaSala).padStart(3, '0')}`,
                timestamp: Date.now()
            });

            atualizarStatus(); // Atualiza o contador após chamar
        }

        function resetarTudo() {
            if (confirm("Isso voltará todas as salas para a senha 001 e limpará a TV. Confirma?")) {
                localStorage.clear();
                db.ref('chamada').set({
                    nome: "AGUARDANDO...",
                    sala: "--",
                    senha: "---",
                    timestamp: Date.now()
                }).then(() => {
                    atualizarStatus();
                    location.reload();
                });
            }
        }

        function limparHistoricoPainel() {
            if (confirm("Deseja realmente apagar o histórico de senhas da TV?")) {
                db.ref('chamada').update({
                    comando: "LIMPAR_HISTORICO",
                    timestamp: Date.now() 
                }).then(() => {
                    alert("Comando enviado! O histórico será apagado.");
                    setTimeout(() => {
                        db.ref('chamada').update({ comando: "" });
                    }, 2000);
                });
            }
        }

        // Inicia o status ao abrir a página
        atualizarStatus();

    </script>
</body>
</html>
